name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpp:
    name: C++ / ${{ matrix.architecture }} / ${{ matrix.configuration }}
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        architecture: [x86, x64]
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v7

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          vs-version: '[18.0,19.0)'
          msbuild-architecture: x64

      - name: Build C++ apps
        run: >-
          msbuild EtlDemo.sln /m /nologo /verbosity:minimal
          "/t:MinimalApp;ContinuousApp;ProviderApp"
          /p:Configuration=${{ matrix.configuration }}
          /p:Platform=${{ matrix.architecture }}

  csharp:
    name: C# / Any CPU / ${{ matrix.configuration }}
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build DemoAppCS
        run: dotnet build DemoAppCS\DemoAppCS.csproj --configuration ${{ matrix.configuration }} --nologo

      - name: Build EtlDump
        run: dotnet build EtlDump\EtlDump.csproj --configuration ${{ matrix.configuration }} --nologo
